<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小一數學：18以內數的分解與合成大挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: "MicroSoft JhengHei", "PingFang TC", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 畫面切換控制 */
        .screen {
            display: none;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主選單與標題 */
        h1 {
            font-size: 2.2rem;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 10px 0 5px 0;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        /* 設定選項區塊 */
        .settings-card {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
            margin-bottom: 25px;
        }

        .setting-group {
            margin-bottom: 18px;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .option-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .opt-btn {
            background: #ffffff;
            border: 2px solid #b2bec3;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #636e72;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #b2bec3;
        }

        .opt-btn:hover {
            transform: translateY(-2px);
        }

        .opt-btn.active {
            background: #ff6b6b;
            color: white;
            border-color: #ee5253;
            box-shadow: 0 3px 0 #ee5253;
        }

        /* 按鈕樣式 */
        .menu-btns {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #ee5253, 0 10px 10px rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #ee5253, 0 12px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #ee5253, 0 4px 4px rgba(0,0,0,0.15);
        }

        .btn-blue {
            background-color: #48dbfb;
            box-shadow: 0 6px 0 #0abde3, 0 10px 10px rgba(0,0,0,0.15);
        }
        .btn-blue:hover { box-shadow: 0 8px 0 #0abde3, 0 12px 12px rgba(0,0,0,0.15); }
        .btn-blue:active { box-shadow: 0 2px 0 #0abde3, 0 4px 4px rgba(0,0,0,0.15); }

        .btn-back {
            background-color: #8395a7;
            box-shadow: 0 4px 0 #576574;
            font-size: 0.95rem;
            padding: 8px 20px;
            margin-bottom: 10px;
        }

        /* 遊戲頂部資訊欄 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .info-card {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d3436;
        }

        /* 三圓圈結構 SVG 容器 */
        .game-area {
            position: relative;
            width: 320px;
            height: 230px;
            margin: 5px auto;
        }

        .number-bond-svg {
            width: 100%;
            height: 100%;
        }

        /* 數字圓圈樣式 (已修改為粉藍與粉紅配色) */
        .circle-bg { transition: all 0.3s; }
        .top-circle { fill: #feca57; stroke: #ff9f43; stroke-width: 5; }      /* 上方：亮黃色 */
        .left-circle { fill: #a2d2ff; stroke: #48dbfb; stroke-width: 5; }     /* 左下：粉藍色 */
        .right-circle { fill: #ffafcc; stroke: #ff6b81; stroke-width: 5; }    /* 右下：粉紅色 */

        .target-circle {
            fill: #ffffff !important;
            stroke: #ff9f43 !important;
            stroke-width: 6 !important;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); transform-origin: center; }
            100% { transform: scale(1.05); transform-origin: center; }
        }

        .circle-text {
            font-size: 38px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            fill: #2d3436;
        }

        .target-text {
            fill: #ff9f43;
            font-size: 44px;
        }

        /* 數字按鍵區 */
        .keypad {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 550px;
            width: 100%;
            margin-top: 10px;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .num-btn {
            flex: 1;
            min-width: 36px;
            height: 48px;
            font-size: 1.3rem;
            font-weight: bold;
            background: white;
            color: #2d3436;
            border: 2px solid #c8d6e5;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c8d6e5;
            transition: all 0.05s;
        }

        .num-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #c8d6e5;
            background-color: #f1f2f6;
        }

        /* 雙人對戰模式佈局 */
        .versus-container {
            display: flex;
            width: 100%;
            gap: 20px;
            justify-content: center;
        }

        .player-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.75);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-1 { border: 4px solid #ff6b6b; }
        .player-2 { border: 4px solid #48dbfb; }

        .player-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .p1-color { color: #ee5253; }
        .p2-color { color: #0abde3; }

        /* 震動效果 (答錯時) */
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* 彈出結算視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h2 { font-size: 2rem; margin-top: 0; color: #2d3436; }
        .modal p { font-size: 1.2rem; color: #636e72; }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        @media (max-width: 768px) {
            .versus-container { flex-direction: column; }
            .game-area { width: 260px; height: 180px; }
            .circle-text { font-size: 30px; }
            .num-btn { height: 42px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <!-- 1. 主選單畫面 -->
    <div id="menu-screen" class="screen active">
        <h1>🎈 數字拆合大挑戰 🎈</h1>
        <div class="subtitle">小學一年級數學：18以內分解與合成（單數不超過9）</div>

        <!-- 遊戲設定卡片 -->
        <div class="settings-card">
            <!-- 難度/題目類型選擇 -->
            <div class="setting-group">
                <div class="setting-title">🎯 1. 選擇題目類型</div>
                <div class="option-grid" id="type-options">
                    <button class="opt-btn active" data-value="decomp">1. 只做分解 (填下方)</button>
                    <button class="opt-btn" data-value="comp">2. 只做合成 (填上方)</button>
                    <button class="opt-btn" data-value="mixed">3. 混合模式</button>
                </div>
            </div>

            <!-- 數字範圍選擇 -->
            <div class="setting-group">
                <div class="setting-title">🔢 2. 選擇合成總數範圍</div>
                <div class="option-grid" id="range-options">
                    <button class="opt-btn active" data-value="2-10">2 - 10</button>
                    <button class="opt-btn" data-value="11-13">11 - 13</button>
                    <button class="opt-btn" data-value="14-18">14 - 18</button>
                    <button class="opt-btn" data-value="2-18">2 - 18</button>
                </div>
            </div>
        </div>

        <!-- 模式按鈕 -->
        <div class="menu-btns">
            <button class="btn" onclick="startSingleGame()">👤 單人計時賽</button>
            <button class="btn btn-blue" onclick="startVersusGame()">👥 雙人搶分戰</button>
        </div>
    </div>

    <!-- 2. 單人遊戲畫面 -->
    <div id="single-screen" class="screen">
        <button class="btn btn-back" onclick="showMenu()">⬅ 返回主選單</button>
        <div class="top-bar">
            <div class="info-card">得分：<span id="single-score">0</span></div>
            <div class="info-card">倒數：<span id="single-timer">60</span> 秒</div>
        </div>
        <div id="single-game-area" class="game-area"></div>
        <div id="single-keypad" class="keypad"></div>
    </div>

    <!-- 3. 雙人對戰畫面 -->
    <div id="versus-screen" class="screen">
        <button class="btn btn-back" onclick="showMenu()">⬅ 返回主選單</button>
        <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #2d3436;">
            🏆 先獲得 10 分的玩家獲勝！
        </div>
        <div class="versus-container">
            <!-- 玩家 1 -->
            <div class="player-box player-1">
                <div class="player-title p1-color">🐱 喵喵隊 (P1)</div>
                <div style="font-size: 1.1rem; margin-bottom: 5px;">得分：<span id="p1-score">0</span></div>
                <div id="p1-game-area" class="game-area"></div>
                <div id="p1-keypad" class="keypad"></div>
            </div>
            <!-- 玩家 2 -->
            <div class="player-box player-2">
                <div class="player-title p2-color">🐶 汪汪隊 (P2)</div>
                <div style="font-size: 1.1rem; margin-bottom: 5px;">得分：<span id="p2-score">0</span></div>
                <div id="p2-game-area" class="game-area"></div>
                <div id="p2-keypad" class="keypad"></div>
            </div>
        </div>
    </div>

    <!-- 結算彈窗 -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">時間到！</h2>
            <p id="modal-msg">你得到了 0 分！</p>
            <button class="btn" onclick="showMenu()">再玩一次</button>
        </div>
    </div>

    <script>
        // 設定狀態
        let selectedType = 'decomp'; // 'decomp'(分解), 'comp'(合成), 'mixed'(混合)
        let selectedRange = [2, 10]; // [min, max]

        // 綁定選項點擊事件
        document.querySelectorAll('#type-options .opt-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#type-options .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.value;
            };
        });

        document.querySelectorAll('#range-options .opt-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#range-options .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const val = btn.dataset.value;
                if (val === '2-10') selectedRange = [2, 10];
                else if (val === '11-13') selectedRange = [11, 13];
                else if (val === '14-18') selectedRange = [14, 18];
                else if (val === '2-18') selectedRange = [2, 18];
            };
        });

        // 音效合成器 (免外置音效檔)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.15, now + idx * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    o.start(now + idx * 0.1);
                    o.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        // 題目產生邏輯（嚴格確保：總數 <= 18，左下與右下均 <= 9）
        function generateQuestion() {
            const minNum = selectedRange[0];
            const maxNum = selectedRange[1];

            // 1. 產生總數 (合成結果 <= 18)
            const total = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;

            // 2. 計算左下數字的合理範圍 (確保 left <= 9 且 right = total - left <= 9)
            const minLeft = Math.max(0, total - 9);
            const maxLeft = Math.min(total, 9);

            // 3. 隨機生成 left 與 right
            const left = Math.floor(Math.random() * (maxLeft - minLeft + 1)) + minLeft;
            const right = total - left;

            // 4. 根據模式決定空格位置
            let missing;
            if (selectedType === 'comp') {
                missing = 0; // 只做合成 (上方未知)
            } else if (selectedType === 'decomp') {
                missing = Math.random() < 0.5 ? 1 : 2; // 只做分解 (下方未知)
            } else {
                missing = Math.floor(Math.random() * 3); // 混合模式
            }

            let answer;
            if (missing === 0) answer = total;
            else if (missing === 1) answer = left;
            else answer = right;

            return { total, left, right, missing, answer };
        }

        // 繪製三圓圈結構 (SVG)
        function renderDiagram(containerId, qData) {
            const container = document.getElementById(containerId);

            const topVal = qData.missing === 0 ? '?' : qData.total;
            const leftVal = qData.missing === 1 ? '?' : qData.left;
            const rightVal = qData.missing === 2 ? '?' : qData.right;

            const topClass = qData.missing === 0 ? 'circle-bg top-circle target-circle' : 'circle-bg top-circle';
            const leftClass = qData.missing === 1 ? 'circle-bg left-circle target-circle' : 'circle-bg left-circle';
            const rightClass = qData.missing === 2 ? 'circle-bg right-circle target-circle' : 'circle-bg right-circle';

            const topTextClass = qData.missing === 0 ? 'circle-text target-text' : 'circle-text';
            const leftTextClass = qData.missing === 1 ? 'circle-text target-text' : 'circle-text';
            const rightTextClass = qData.missing === 2 ? 'circle-text target-text' : 'circle-text';

            container.innerHTML = `
                <svg viewBox="0 0 320 230" class="number-bond-svg">
                    <!-- 斜線連接線 -->
                    <line x1="160" y1="60" x2="85" y2="165" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
                    <line x1="160" y1="60" x2="235" y2="165" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>

                    <!-- 上方中央圓圈 (合成結果) -->
                    <circle cx="160" cy="60" r="42" class="${topClass}" />
                    <text x="160" y="60" class="${topTextClass}">${topVal}</text>

                    <!-- 左下方圓圈 (分解結果 1 - 粉藍色) -->
                    <circle cx="85" cy="165" r="38" class="${leftClass}" />
                    <text x="85" y="165" class="${leftTextClass}">${leftVal}</text>

                    <!-- 右下方圓圈 (分解結果 2 - 粉紅色) -->
                    <circle cx="235" cy="165" r="38" class="${rightClass}" />
                    <text x="235" y="165" class="${rightTextClass}">${rightVal}</text>
                </svg>
            `;
        }

        // 建立 0 ~ 18 的數字按鍵面板
        function renderKeypad(containerId, onKeyPress) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const row1 = document.createElement('div');
            row1.className = 'key-row';
            for (let i = 0; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.onclick = () => onKeyPress(i);
                row1.appendChild(btn);
            }

            const row2 = document.createElement('div');
            row2.className = 'key-row';
            for (let i = 10; i <= 18; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.onclick = () => onKeyPress(i);
                row2.appendChild(btn);
            }

            container.appendChild(row1);
            container.appendChild(row2);
        }

        // 全域遊戲狀態
        let singleScore = 0;
        let singleTimer = 60;
        let singleInterval;
        let singleCurrentQ;

        let p1Score = 0, p2Score = 0;
        let p1Q, p2Q;
        let isGameActive = false;

        // 畫面切換
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.getElementById('result-modal').style.display = 'none';
        }

        function showMenu() {
            clearInterval(singleInterval);
            isGameActive = false;
            showScreen('menu-screen');
        }

        // --- 單人模式 ---
        function startSingleGame() {
            singleScore = 0;
            singleTimer = 60;
            isGameActive = true;
            document.getElementById('single-score').innerText = singleScore;
            document.getElementById('single-timer').innerText = singleTimer;

            showScreen('single-screen');
            renderKeypad('single-keypad', handleSingleInput);
            nextSingleQuestion();

            clearInterval(singleInterval);
            singleInterval = setInterval(() => {
                singleTimer--;
                document.getElementById('single-timer').innerText = singleTimer;
                if (singleTimer <= 0) {
                    clearInterval(singleInterval);
                    endSingleGame();
                }
            }, 1000);
        }

        function nextSingleQuestion() {
            singleCurrentQ = generateQuestion();
            renderDiagram('single-game-area', singleCurrentQ);
        }

        function handleSingleInput(num) {
            if (!isGameActive) return;
            if (num === singleCurrentQ.answer) {
                playSound('correct');
                singleScore += 10;
                document.getElementById('single-score').innerText = singleScore;
                nextSingleQuestion();
            } else {
                playSound('wrong');
                const area = document.getElementById('single-game-area');
                area.classList.add('shake');
                setTimeout(() => area.classList.remove('shake'), 400);
            }
        }

        function endSingleGame() {
            isGameActive = false;
            playSound('win');
            triggerConfetti();
            document.getElementById('modal-title').innerText = "🎉 時間到！";
            document.getElementById('modal-msg').innerText = `太棒了！你總共獲得了 ${singleScore} 分！`;
            document.getElementById('result-modal').style.display = 'flex';
        }

        // --- 雙人對戰模式 ---
        function startVersusGame() {
            p1Score = 0;
            p2Score = 0;
            isGameActive = true;

            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p2-score').innerText = p2Score;

            showScreen('versus-screen');

            renderKeypad('p1-keypad', (num) => handleVersusInput(1, num));
            renderKeypad('p2-keypad', (num) => handleVersusInput(2, num));

            nextVersusQuestion(1);
            nextVersusQuestion(2);
        }

        function nextVersusQuestion(playerNum) {
            if (playerNum === 1) {
                p1Q = generateQuestion();
                renderDiagram('p1-game-area', p1Q);
            } else {
                p2Q = generateQuestion();
                renderDiagram('p2-game-area', p2Q);
            }
        }

        function handleVersusInput(playerNum, num) {
            if (!isGameActive) return;

            const currentQ = (playerNum === 1) ? p1Q : p2Q;
            const areaId = (playerNum === 1) ? 'p1-game-area' : 'p2-game-area';

            if (num === currentQ.answer) {
                playSound('correct');
                if (playerNum === 1) {
                    p1Score++;
                    document.getElementById('p1-score').innerText = p1Score;
                } else {
                    p2Score++;
                    document.getElementById('p2-score').innerText = p2Score;
                }

                if (p1Score >= 10 || p2Score >= 10) {
                    endVersusGame(playerNum);
                } else {
                    nextVersusQuestion(playerNum);
                }
            } else {
                playSound('wrong');
                const area = document.getElementById(areaId);
                area.classList.add('shake');
                setTimeout(() => area.classList.remove('shake'), 400);
            }
        }

        function endVersusGame(winner) {
            isGameActive = false;
            playSound('win');
            triggerConfetti();

            const winnerName = winner === 1 ? "🐱 喵喵隊" : "🐶 汪汪隊";
            document.getElementById('modal-title').innerText = "🏆 勝負已分！";
            document.getElementById('modal-msg').innerText = `恭喜 ${winnerName} 率先達到 10 分獲得勝利！`;
            document.getElementById('result-modal').style.display = 'flex';
        }

        // 彩帶特效
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    angle: Math.random() * 360
                });
            }

            let animId;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speed;
                    p.angle += 3;
                    if (p.y > canvas.height) p.y = -10;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                animId = requestAnimationFrame(render);
            }
            render();
            setTimeout(() => {
                cancelAnimationFrame(animId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 3500);
        }
    </script>
</body>
